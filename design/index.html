document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

one\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M13 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- Onlinebestellung Milchpumpe -->\n  <section id='kMilchpumpe' style='padding:clamp(48px,6vw,84px) clamp(16px,3vw,36px);background:#f7f4ec;color:#282828'><div style='max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 40px'><div style='display:flex;flex-direction:column;gap:14px;flex:1 1 520px;min-width:0'><span style='font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#3a4bb8;font-weight:700'>Leih-Milchpumpe · Onlinebestellung<\u002Fspan><h2 style='font-size:clamp(32px,4vw,54px);line-height:1.08;margin:0;color:#141c5c'>Klinik-Milchpumpe <em style='font-style:italic;color:#3a4bb8'>für zuhause<\u002Fem>.<\u002Fh2><div style='display:flex;flex-wrap:wrap;gap:8px'><span style='display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid rgba(20,28,92,.1);font-size:13.5px;color:#141c5c;font-weight:600'><span style='display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#141c5c;color:#fbf389;font-size:11px;font-weight:800'>1<\u002Fspan>Formular ausfüllen<\u002Fspan><span style='display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid rgba(20,28,92,.1);font-size:13.5px;color:#141c5c;font-weight:600'><span style='display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#141c5c;color:#fbf389;font-size:11px;font-weight:800'>2<\u002Fspan>Bestätigung per Mail<\u002Fspan><span style='display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid rgba(20,28,92,.1);font-size:13.5px;color:#141c5c;font-weight:600'><span style='display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#141c5c;color:#fbf389;font-size:11px;font-weight:800'>3<\u002Fspan>Liefertermin per Telefon<\u002Fspan><\u002Fdiv><\u002Fdiv><button type='button' sc-camel-on-click='{{ mpToggle }}' aria-expanded='{{ mpOpen }}' aria-controls='kMilchpumpeBody' style='flex:none;display:flex;align-items:center;gap:12px;padding:16px 26px;border:0;border-radius:999px;background:#141c5c;color:#fbf389;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s' style-hover='background:#282828'><span>{{ mpBtn }}<\u002Fspan><svg width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' style='transition:transform .45s cubic-bezier(.2,.7,.2,1);transform:rotate({{ mpRot }})'><path d='M6 9l6 6 6-6'><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv><div id='kMilchpumpeBody' style='display:grid;grid-template-rows:{{ mpRows }};transition:grid-template-rows .65s cubic-bezier(.2,.7,.2,1)'><div style='min-height:0;overflow:hidden'><div style='padding-top:clamp(28px,4vw,44px);opacity:{{ mpOp }};transform:translateY({{ mpY }});transition:opacity .45s ease .12s,transform .6s cubic-bezier(.2,.7,.2,1) .08s'><div style='max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(24px,4vw,56px);align-items:start'><div style='display:flex;flex-direction:column;gap:16px'><p style='margin:0;font-size:16px;line-height:1.7;color:rgba(40,40,40,.78);text-wrap:pretty'>Die Bestellung läuft ganz einfach: Formular ausfüllen und absenden. Nach dem Absenden prüfen wir Ihre Angaben und geben die Bestellung an unseren Außendienst weiter. Gleichzeitig erhalten Sie eine Bestätigung per Mail. Der Außendienst meldet sich telefonisch, um einen Liefertermin mit Ihnen zu vereinbaren.<\u002Fp><div style='padding:14px 18px;border-radius:14px;background:#141c5c;color:#f7f4ec;font-size:14px;line-height:1.6'><strong style='color:#fbf389'>Wichtig:<\u002Fstrong> Bitte immer die Daten der Mutter eintragen – auch wenn jemand anderes bestellt. Eine abweichende Lieferadresse oder Telefonnummer kann im Nachrichtenfeld angegeben werden.<\u002Fdiv><div style='display:flex;flex-direction:column;gap:8px;font-size:14.5px;line-height:1.6;color:rgba(40,40,40,.82)'><span>Unsere Bestätigung erhalten Sie üblicherweise innerhalb einiger Minuten, spätestens aber in diesen Zeitfenstern:<\u002Fspan><span><strong style='color:#141c5c'>Unter der Woche 9:00–17:00 Uhr:<\u002Fstrong> innerhalb von 30 Minuten<\u002Fspan><span><strong style='color:#141c5c'>Am Wochenende/an Feiertagen 9:00–16:00 Uhr:<\u002Fstrong> innerhalb einer Stunde<\u002Fspan><span><strong style='color:#141c5c'>Nach 17:00 Uhr (werktags) oder nach 16:00 Uhr (Wochenende/Feiertage):<\u002Fstrong> am nächsten Morgen bis 9:00 Uhr<\u002Fspan><\u002Fdiv><div style='display:flex;flex-direction:column;border:1px solid rgba(20,28,92,.12);border-radius:16px;background:#fff;overflow:hidden'><strong style='padding:14px 18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#3a4bb8'>Hinweise<\u002Fstrong><details name='mpHinweise' open style='border-top:1px solid rgba(20,28,92,.1)'><summary style='padding:14px 18px;cursor:pointer;font-size:14.5px;font-weight:700;color:#141c5c'>Kostenübernahme durch Ihre Krankenkasse<\u002Fsummary><div style='display:flex;flex-direction:column;gap:10px;padding:0 18px 16px;font-size:13.5px;line-height:1.65;color:rgba(40,40,40,.8)'><span><strong style='color:#141c5c'>Gesetzlich versichert?<\u002Fstrong> Wir rechnen direkt mit Ihrer Krankenkasse ab – Sie brauchen nur die Verordnung (Rezept). Die Erstverordnung stellt oft die Klinik aus, Folgerezepte gibt’s bei:<\u002Fspan><ul style='margin:0;padding-left:18px'><li>Frauenärzt:innen<\u002Fli><li>Kinderärzt:innen<\u002Fli><li>Hausärzt:innen<\u002Fli><\u002Ful><span><strong style='color:#141c5c'>Wichtig:<\u002Fstrong> Um Kosten für Sie zu vermeiden, muss die Mietzeit durchgehend mit Rezepten abgedeckt sein. Wir erinnern Sie automatisch 7 Tage vor Ablauf eines Rezepts per Mail und bestätigen den Eingang jedes neuen Rezepts samt Laufzeit.<\u002Fspan><span><strong style='color:#141c5c'>Privat versichert?<\u002Fstrong> Sie erhalten nach Rückgabe der Pumpe eine Rechnung zur Einreichung bei Ihrer Kasse. Achten Sie bitte ebenfalls auf eine lückenlose Abdeckung der gesamten Mietzeit durch Rezepte.<\u002Fspan><\u002Fdiv><\u002Fdetails><details name='mpHinweise' style='border-top:1px solid rgba(20,28,92,.1)'><summary style='padding:14px 18px;cursor:pointer;font-size:14.5px;font-weight:700;color:#141c5c'>Zubehör – das ist dabei<\u002Fsummary><div style='display:flex;flex-direction:column;gap:10px;padding:0 18px 16px;font-size:13.5px;line-height:1.65;color:rgba(40,40,40,.8)'><span>Die meisten gesetzlichen Krankenkassen sehen ein Zubehörset als ausreichend an. Wir liefern dennoch zwei Sets – denn viele Stillberatungen, Hebammen und auch Familien wünschen das zweite Set.<\u002Fspan><strong style='color:#141c5c'>Gut zu wissen:<\u002Fstrong><ul style='margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px'><li>Ist das zweite Set originalverpackt, können Sie es kostenlos zurückgeben.<\u002Fli><li>Ist es geöffnet, berechnen wir dafür 28,90 € privat.<\u002Fli><li>Standardmäßig liefern wir Brusthauben in Größe M – wenn Sie eine andere Größe benötigen, tragen Sie diese bitte im Textfeld bei der Bestellung ein.<\u002Fli><li>Die Kostenübernahme für Brusthauben ist je nach Kasse unterschiedlich geregelt – manche übernehmen die Kosten vollständig, maximal können 13,80 € anfallen.<\u002Fli><\u002Ful><\u002Fdiv><\u002Fdetails><details name='mpHinweise' style='border-top:1px solid rgba(20,28,92,.1)'><summary style='padding:14px 18px;cursor:pointer;font-size:14.5px;font-weight:700;color:#141c5c'>Kaution<\u002Fsummary><span style='display:block;padding:0 18px 16px;font-size:13.5px;line-height:1.65;color:rgba(40,40,40,.8)'>Für die Ausleihe der Pumpe erheben wir eine Kaution in Höhe von 50 €. Diese überweisen Sie ganz bequem – alle Informationen dazu finden Sie in Ihrer Bestellbestätigung. Nach Rückgabe der Pumpe und Abschluss der Prüfung erstatten wir Ihnen die Kaution vollständig zurück, sofern keine offenen Kosten entstanden sind.<\u002Fspan><\u002Fdetails><details name='mpHinweise' style='border-top:1px solid rgba(20,28,92,.1)'><summary style='padding:14px 18px;cursor:pointer;font-size:14.5px;font-weight:700;color:#141c5c'>Rückgabe<\u002Fsummary><span style='display:block;padding:0 18px 16px;font-size:13.5px;line-height:1.65;color:rgba(40,40,40,.8)'><strong style='color:#141c5c'>Rückgabe leicht gemacht:<\u002Fstrong> Sie schicken die Pumpe einfach zurück – das Porto übernehmen Sie. Wir stellen Ihnen einen DHL-QR-Code zur Verfügung für den einfachen Versand oder zur Paketabholung.<br><br>Je nach Region kann die Pumpe auch zurückgebracht oder neben dem Lieferdienst abgeholt werden. Sprechen Sie dafür einfach unsere Mitarbeitenden vor Ort an.<\u002Fspan><\u002Fdetails><\u002Fdiv><span style='font-size:13.5px;color:rgba(40,40,40,.75)'>Noch Fragen? Unser Außendienst ist gern für Sie da, wenn er sich zur Absprache der Lieferung meldet – oder rufen Sie uns an: <a href='tel:+492306306090' style='color:#141c5c;text-decoration:underline'>02306 30609-0<\u002Fa><\u002Fspan><\u002Fdiv><div style='padding:clamp(20px,3vw,32px);border-radius:24px;background:#fff;border:1px solid rgba(20,28,92,.08);box-shadow:0 20px 50px -30px rgba(20,28,92,.35)'><sc-if value='{{ mpForm }}' hint-placeholder-val='{{ true }}'><div style='display:flex;flex-direction:column;gap:16px'><h3 style='margin:0;font-size:22px;color:#141c5c'>Bestellformular<\u002Fh3><span style='margin-top:-10px;font-size:12.5px;color:rgba(40,40,40,.65)'>* Pflichtfelder<\u002Fspan><div class='k-form-grid' style='display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px'><sc-for list='{{ mpFields }}' as='mf' hint-placeholder-count='10'><label style='display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#141c5c;min-width:0'>{{ mf.l }}<input type='{{ mf.t }}' style='width:100%;padding:13px 16px;border:1px solid rgba(20,28,92,.16);border-radius:12px;background:#fff;font:inherit;font-size:14.5px;color:#282828;box-sizing:border-box;min-width:0'><\u002Flabel><\u002Fsc-for><div style='grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:#282828'><span style='width:100%;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#141c5c'>Aufenthalt<\u002Fspan><label style='display:flex;gap:8px;align-items:center'><input type='radio' name='mpOrt'>entlassen<\u002Flabel><label style='display:flex;gap:8px;align-items:center'><input type='radio' name='mpOrt'>noch im Krankenhaus<\u002Flabel><\u002Fdiv><sc-for list='{{ mpFields2 }}' as='mf' hint-placeholder-count='4'><label style='display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#141c5c;min-width:0'>{{ mf.l }}<input type='{{ mf.t }}' style='width:100%;padding:13px 16px;border:1px solid rgba(20,28,92,.16);border-radius:12px;background:#fff;font:inherit;font-size:14.5px;color:#282828;box-sizing:border-box;min-width:0'><\u002Flabel><\u002Fsc-for><label style='grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#141c5c;min-width:0'>Hinweis zur Lieferung<textarea rows='3' placeholder='Besonderer Hinweis für die Lieferung (z. B. Brusthaubengröße, abweichende Lieferadresse u. a.)' style='width:100%;padding:13px 16px;border:1px solid rgba(20,28,92,.16);border-radius:12px;background:#fff;font:inherit;font-size:14.5px;color:#282828;box-sizing:border-box;min-width:0;resize:vertical'><\u002Ftextarea><\u002Flabel><\u002Fdiv><label style='display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.55;color:rgba(40,40,40,.8)'><input type='checkbox' style='margin-top:3px;flex:none'><span>Ich habe die <a href='#datenschutz' style='color:#141c5c;text-decoration:underline'>Datenschutzerklärung<\u002Fa> zur Kenntnis genommen. Ich stimme zu, dass meine Angaben und Daten zur Beantwortung meiner Anfrage elektronisch erhoben und gespeichert werden. Hinweis: Sie können Ihre Einwilligung jederzeit für die Zukunft per E-Mail an medizintechnik@kaasen.de widerrufen.<\u002Fspan><\u002Flabel><button type='button' sc-camel-on-click='{{ mpSubmit }}' style='align-self:flex-start;padding:15px 28px;border:0;border-radius:999px;background:#141c5c;color:#fbf389;font-size:15px;font-weight:700;cursor:pointer' style-hover='background:#282828'>Senden<\u002Fbutton><\u002Fdiv><\u002Fsc-if><sc-if value='{{ mpSent }}' hint-placeholder-val='{{ false }}'><div style='display:flex;flex-direction:column;gap:12px;align-items:flex-start'><span style='display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#fbf389;color:#141c5c;font-size:22px;font-weight:800'>✓<\u002Fspan><h3 style='margin:0;font-size:22px;color:#141c5c'>Vielen Dank für Ihre Bestellung.<\u002Fh3><p style='margin:0;font-size:15px;line-height:1.65;color:rgba(40,40,40,.78)'>Sie erhalten in Kürze eine Bestätigung per Mail. Unser Außendienst meldet sich telefonisch für den Liefertermin.<\u002Fp><button type='button' sc-camel-on-click='{{ mpReset }}' style='padding:11px 20px;border:1.5px solid #141c5c;border-radius:999px;background:transparent;color:#141c5c;font-size:14px;font-weight:700;cursor:pointer'>Neue Bestellung<\u002Fbutton><\u002Fdiv><\u002Fsc-if><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n\n  <!-- Rezept upload -->\n  <section id=\"kRezept\" style=\"padding:clamp(48px,6vw,84px) clamp(16px,3vw,36px);background:#141c5c;color:#f7f4ec;position:relative;overflow:hidden\">\n    <svg sc-camel-view-box=\"0 0 1400 80\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;top:0;left:0;width:100%;height:80px;opacity:.35\" aria-hidden=\"true\">\n      <path d=\"M0 40 C 175 0, 350 80, 525 40 S 875 0, 1050 40 S 1400 80, 1400 40\" stroke=\"#fbf389\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpath>\n    <\u002Fsvg>\n    <div style=\"position:relative;max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,4vw,56px);align-items:center\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <span style=\"font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:#fbf389;font-weight:700\">Hilfsmittel auf Rezept<\u002Fspan>\n        <h2 style=\"font-size:clamp(30px,4vw,54px);color:#f7f4ec\">Rezept einreichen.<\u002Fh2>\n        <p style=\"margin:0;max-width:34em;font-size:16.5px;line-height:1.7;color:rgba(247,244,236,.78)\">Laden Sie Ihre ärztliche Verordnung einfach online hoch. So können wir Ihre Anfrage schnell bearbeiten.<\u002Fp>\n        <div style=\"margin:0;max-width:34em;padding:16px 18px;border-left:3px solid #fbf389;background:rgba(251,243,137,.08);border-radius:0 12px 12px 0\">\n          <strong style=\"display:block;color:#fbf389;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px\">Nicht für Milchpumpen<\u002Fstrong>\n          <span style=\"font-size:14.5px;line-height:1.65;color:rgba(247,244,236,.86)\">Milchpumpen-Rezepte benötigen wir im Original — bitte nutzen Sie die <a href=\"#kMilchpumpe\" style=\"color:#fbf389;text-decoration:underline\">Onlinebestellung Milchpumpe<\u002Fa>. Für Rezept-Status &amp; Verlängerung: <a href=\"https://rezept.kaasen.de\" style=\"color:#fbf389;text-decoration:underline\">rezept.kaasen.de<\u002Fa>.<\u002Fspan>\n        <\u002Fdiv>\n        <div style='display:flex;flex-direction:column;gap:10px;margin-top:4px'><span style='font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#f7f4ec;font-weight:700'>Mögliche Kassenleistung<\u002Fspan><div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px'><div style='display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:16px;background:rgba(247,244,236,.07);border:1px solid rgba(247,244,236,.18)'><span style='display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#fbf389;font-weight:700'><span style='display:block;width:8px;height:8px;border-radius:50%;background:#fbf389'><\u002Fspan>Gelistete Hilfsmittel<\u002Fspan><div style='display:flex;flex-wrap:wrap;gap:6px'><sc-for list='{{ rezListed }}' as='rp' hint-placeholder-count='3'><span style='padding:6px 12px;border-radius:999px;background:#fbf389;color:#141c5c;font-size:12.5px;font-weight:700'>{{ rp }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv><div style='display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:16px;background:rgba(247,244,236,.07);border:1px solid rgba(247,244,236,.18)'><span style='display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#a6b2ff;font-weight:700'><span style='display:block;width:8px;height:8px;border-radius:50%;border:2px solid #a6b2ff;box-sizing:border-box'><\u002Fspan>Nicht gelistete Hilfsmittel<\u002Fspan><div style='display:flex;flex-wrap:wrap;gap:6px'><sc-for list='{{ rezUnlisted }}' as='rp' hint-placeholder-count='3'><span style='padding:5px 11px;border-radius:999px;border:1.5px solid #a6b2ff;color:#f7f4ec;font-size:12.5px;font-weight:600'>{{ rp }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style='display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:16px;border:1px dashed rgba(247,244,236,.3)'><span style='display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#f7f4ec;font-weight:700'><span style='display:block;width:8px;height:8px;border-radius:2px;background:#f7f4ec'><\u002Fspan>Ausschließlich Verkauf<\u002Fspan><span style='font-size:13.5px;line-height:1.55;color:rgba(247,244,236,.86)'>Alle Produkte, die nicht unter gelistete oder nicht gelistete Hilfsmittel fallen, werden nicht von der Krankenkasse übernommen.<\u002Fspan><div style='display:flex;flex-wrap:wrap;gap:6px'><sc-for list='{{ rezSale }}' as='rp' hint-placeholder-count='3'><span style='padding:5px 11px;border-radius:999px;background:rgba(247,244,236,.12);color:#f7f4ec;font-size:12.5px;font-weight:600'>{{ rp }}<\u002Fspan><\u002Fsc-for><\u002Fdiv><\u002Fdiv><div style='border-radius:16px;background:rgba(247,244,236,.05);border:1px solid rgba(247,244,236,.14);overflow:hidden'><button sc-camel-on-click='{{ toggleRezInfo }}' style='display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:14px 18px;border:0;background:transparent;color:#f7f4ec;font:inherit;font-size:14px;font-weight:700;text-align:left;cursor:pointer' style-hover='color:#fbf389'>Was heißt das?<span style='flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fbf389;color:#141c5c;font-size:14px;font-weight:800'>{{ rezInfoSign }}<\u002Fspan><\u002Fbutton><div style='max-height:{{ rezInfoMax }};overflow:hidden;transition:max-height .38s cubic-bezier(.22,.61,.36,1)'><div style='display:flex;flex-direction:column;gap:10px;padding:0 18px 16px;font-size:14px;line-height:1.6;color:rgba(247,244,236,.86)'><span><strong style='color:#fbf389'>Gelistet:<\u002Fstrong> Das Hilfsmittel steht im Hilfsmittelverzeichnis der Krankenkassen. Mit Rezept wird es mit hoher Wahrscheinlichkeit übernommen.<\u002Fspan><span><strong style='color:#a6b2ff'>Nicht gelistet:<\u002Fstrong> Kann ärztlich verordnet werden. Ob die Krankenkasse die Kosten übernimmt, ist fraglich — wir prüfen das für Sie.<\u002Fspan><span><strong style='color:#f7f4ec'>Ausschließlich Verkauf:<\u002Fstrong> Alle Produkte, die nicht unter gelistete oder nicht gelistete Hilfsmittel fallen, werden nicht von der Krankenkasse übernommen. Sie können sie direkt bei uns kaufen.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"k-rezept-chips\" style=\"display:none;flex-wrap:wrap;gap:6px;margin-top:4px\">\n          <span style=\"font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(247,244,236,.55);width:100%;margin-bottom:4px\">Rezept einreichbar für:<\u002Fspan>\n          <sc-for list=\"{{ rezProducts }}\" as=\"rp\" hint-placeholder-count=\"6\">\n            <span style=\"padding:6px 12px;border:1px solid rgba(247,244,236,.2);border-radius:999px;font-size:12.5px;font-weight:600;color:#f7f4ec\">{{ rp }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px\">\n          <sc-for list=\"{{ rezSteps }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <li style=\"display:flex;align-items:flex-start;gap:12px\">\n              <span style=\"flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fbf389;color:#141c5c;font-size:12px;font-weight:800\">✓<\u002Fspan>\n              <span style=\"color:rgba(247,244,236,.86)\">{{ r }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n        <span style=\"max-width:34em;font-size:13px;line-height:1.6;color:rgba(247,244,236,.6)\">Das Originalrezept benötigen wir zusätzlich per Post. Der digitale Upload beschleunigt die Bearbeitung. Rezepte per Fax können wir leider nicht annehmen.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;padding:clamp(24px,3vw,36px);border-radius:26px;background:#f7f4ec;color:#282828;box-shadow:0 40px 80px -50px rgba(0,0,0,.7)\" data-comment-anchor=\"d32df43a5c-div\">\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#3a4bb te entnehmen.','Wie erfassen wir Ihre Daten?','Ihre Daten werden zum einen dadurch erhoben, dass Sie uns diese mitteilen. Hierbei kann es sich z.B. um Daten handeln, die Sie in ein Kontaktformular eingeben.','Andere Daten werden automatisch beim Besuch der Website durch unsere IT-Systeme erfasst. Das sind vor allem technische Daten (z.B. Internetbrowser, Betriebssystem oder Uhrzeit des Seitenaufrufs). Die Erfassung dieser Daten erfolgt automatisch, sobald Sie unsere Website betreten.','Wofür nutzen wir Ihre Daten?','Ein Teil der Daten wird erhoben, um eine fehlerfreie Bereitstellung der Website zu gewährleisten. Andere Daten können zur Analyse Ihres Nutzerverhaltens verwendet werden.','Welche Rechte haben Sie bezüglich Ihrer Daten?','Sie haben jederzeit das Recht unentgeltlich Auskunft über Herkunft, Empfänger und Zweck Ihrer gespeicherten personenbezogenen Daten zu erhalten. Sie haben außerdem ein Recht, die Berichtigung, Sperrung oder Löschung dieser Daten zu verlangen. Hierzu sowie zu weiteren Fragen zum Thema Datenschutz können Sie sich jederzeit unter der im Impressum angegebenen Adresse an uns wenden. Des Weiteren steht Ihnen ein Beschwerderecht bei der zuständigen Aufsichtsbehörde zu.','Außerdem haben Sie das Recht, unter bestimmten Umständen die Einschränkung der Verarbeitung Ihrer personenbezogenen Daten zu verlangen. Details hierzu entnehmen Sie der Datenschutzerklärung unter „Recht auf Einschränkung der Verarbeitung“.','## Analyse-Tools und Tools von Drittanbietern','Beim Besuch unserer Website kann Ihr Surf-Verhalten statistisch ausgewertet werden. Das geschieht vor allem mit Cookies und mit sogenannten Analyseprogrammen. Die Analyse Ihres Surf-Verhaltens erfolgt in der Regel anonym; das Surf-Verhalten kann nicht zu Ihnen zurückverfolgt werden. Sie können dieser Analyse widersprechen oder sie durch die Nichtbenutzung bestimmter Tools verhindern. Detaillierte Informationen dazu finden Sie in der folgenden Datenschutzerklärung.','Sie können dieser Analyse widersprechen. Über die Widerspruchsmöglichkeiten werden wir Sie in dieser Datenschutzerklärung informieren.','# 2. Allgemeine Hinweise und Pflichtinformationen','## Datenschutz','Die Betreiber dieser Seiten nehmen den Schutz Ihrer persönlichen Daten sehr ernst. Wir behandeln Ihre personenbezogenen Daten vertraulich und entsprechend der gesetzlichen Datenschutzvorschriften sowie dieser Datenschutzerklärung.','Wenn Sie diese Website benutzen, werden verschiedene personenbezogene Daten erhoben. Personenbezogene Daten sind Daten, mit denen Sie persönlich identifiziert werden können. Die vorliegende Datenschutzerklärung erläutert, welche Daten wir erheben und wofür wir sie nutzen. Sie erläutert auch, wie und zu welchem Zweck das geschieht.','Wir weisen darauf hin, dass die Datenübertragung im Internet (z.B. bei der Kommunikation per E-Mail) Sicherheitslücken aufweisen kann. Ein lückenloser Schutz der Daten vor dem Zugriff durch Dritte ist nicht möglich.','## Hinweis zur verantwortlichen Stelle','Die verantwortliche Stelle für die Datenverarbeitung auf dieser Website ist:','Medizintechnik Kaasen GmbH\\nZum Gewerbepark 4\\n44532 Lünen\\nTelefon: 02306 30609-0\\nE-Mail: medizintechnik@kaasen.de','Verantwortliche Stelle ist die natürliche oder juristische Person, die allein oder gemeinsam mit anderen über die Zwecke und Mittel der Verarbeitung von personenbezogenen Daten (z.B. Namen, E-Mail-Adressen o. Ä.) entscheidet.','## Widerruf Ihrer Einwilligung zur Datenverarbeitung','Viele Datenverarbeitungsvorgänge sind nur mit Ihrer ausdrücklichen Einwilligung möglich. Sie können eine bereits erteilte Einwilligung jederzeit widerrufen. Dazu reicht eine formlose Mitteilung per E-Mail an uns. Die Rechtmäßigkeit der bis zum Widerruf erfolgten Datenverarbeitung bleibt vom Widerruf unberührt.','## Widerspruchsrecht gegen die Datenerhebung in besonderen Fällen sowie gegen Direktwerbung (Art. 21 DSGVO)','Wenn die Datenverarbeitung auf Grundlage von Art. 6 Abs. 1 lit. e oder f DSGVO erfolgt, haben Sie jederzeit das Recht, aus Gründen, die sich aus Ihrer besonderen Situation ergeben, gegen die Verarbeitung Ihrer personenbezogenen Daten Widerspruch einzulegen; dies gilt auch für ein auf diese Bestimmungen gestütztes Profiling. Die jeweilige Rechtsgrundlage, auf denen eine Verarbeitung beruht, entnehmen Sie dieser Datenschutzerklärung. Wenn Sie Widerspruch einlegen, werden wir Ihre betroffenen personenbezogenen Daten nicht mehr verarbeiten, es sei denn, wir können zwingende schutzwürdige Gründe für die Verarbeitung nachweisen, die Ihre Interessen, Rechte und Freiheiten überwiegen oder die Verarbeitung dient der Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen (Widerspruch nach Art. 21 Abs. 1 DSGVO).','Werden Ihre personenbezogenen Daten verarbeitet, um Direktwerbung zu betreiben, so haben Sie das Recht, jederzeit Widerspruch gegen die Verarbeitung Sie betreffender personenbezogener Daten zum Zwecke derartiger Werbung einzulegen; dies gilt auch für das Profiling, soweit es mit solcher Direktwerbung in Verbindung steht. Wenn Sie widersprechen, werden Ihre personenbezogenen Daten anschließend nicht mehr zum Zwecke der Direktwerbung verwendet (Widerspruch nach Art. 21 Abs. 2 DSGVO).','## Beschwerderecht bei der zuständigen Aufsichtsbehörde','Im Falle von Verstößen gegen die DSGVO steht den Betroffenen ein Beschwerderecht bei einer Aufsichtsbehörde, insbesondere in dem Mitgliedstaat ihres gewöhnlichen Aufenthalts, ihres Arbeitsplatzes oder des Orts des mutmaßlichen Verstoßes zu. Das Beschwerderecht besteht unbeschadet anderweitiger verwaltungsrechtlicher oder gerichtlicher Rechtsbehelfe.','## Recht auf Datenübertragbarkeit','Sie haben das Recht, Daten, die wir auf Grundlage Ihrer Einwilligung oder in Erfüllung eines Vertrags automatisiert verarbeiten, an sich oder an einen Dritten in einem gängigen, maschinenlesbaren Format aushändigen zu lassen. Sofern Sie die direkte Übertragung der Daten an einen anderen Verantwortlichen verlangen, erfolgt dies nur, soweit es technisch machbar ist.','## SSL- bzw. TLS-Verschlüsselung','Diese Seite nutzt aus Sicherheitsgründen und zum Schutz der Übertragung vertraulicher Inhalte, wie zum Beispiel Bestellungen oder Anfragen, die Sie an uns als Seitenbetreiber senden, eine SSL-bzw. TLS-Verschlüsselung. Eine verschlüsselte Verbindung erkennen Sie daran, dass die Adresszeile des Browsers von „http://“ auf „https://“ wechselt und an dem Schloss-Symbol in Ihrer Browserzeile.','Wenn die SSL- bzw. TLS-Verschlüsselung aktiviert ist, können die Daten, die Sie an uns übermitteln, nicht von Dritten mitgelesen werden.','## Verschlüsselter Zahlungsverkehr auf dieser Website','Besteht nach dem Abschluss eines kostenpflichtigen Vertrags eine Verpflichtung, uns Ihre Zahlungsdaten (z.B. Kontonummer bei Einzugsermächtigung) zu übermitteln, werden diese Daten zur Zahlungsabwicklung benötigt.','Der Zahlungsverkehr über die gängigen Zahlungsmittel (Visa/MasterCard, Lastschriftverfahren) erfolgt ausschließlich über eine verschlüsselte SSL- bzw. TLS-Verbindung. Eine verschlüsselte Verbindung erkennen Sie daran, dass die Adresszeile des Browsers von „http://“ auf „https://“ wechselt und an dem Schloss-Symbol in Ihrer Browserzeile.','Bei verschlüsselter Kommunikation können Ihre Zahlungsdaten, die Sie an uns übermitteln, nicht von Dritten mitgelesen werden.','## Auskunft, Sperrung, Löschung und Berichtigung','Sie haben im Rahmen der geltenden gesetzlichen Bestimmungen jederzeit das Recht auf unentgeltliche Auskunft über Ihre gespeicherten personenbezogenen Daten, deren Herkunft und Empfänger und den Zweck der Datenverarbeitung und ggf. ein Recht auf Berichtigung, Sperrung oder Löschung dieser Daten. Hierzu sowie zu weiteren Fragen zum Thema personenbezogene Daten können Sie sich jederzeit unter der im Impressum angegebenen Adresse an uns wenden.','## Recht auf Einschränkung der Verarbeitung','Sie haben das Recht, die Einschränkung der Verarbeitung Ihrer personenbezogenen Daten zu verlangen. Hierzu können Sie sich jederzeit unter der im Impressum angegebenen Adresse an uns wenden. Das Recht auf Einschränkung der Verarbeitung besteht in folgenden Fällen:','• Wenn Sie die Richtigkeit Ihrer bei uns gespeicherten personenbezogenen Daten bestreiten, benötigen wir in der Regel Zeit, um dies zu überprüfen. Für die Dauer der Prüfung haben Sie das Recht, die Einschränkung der Verarbeitung Ihrer personenbezogenen Daten zu verlangen.\\n• Wenn die Verarbeitung Ihrer personenbezogenen Daten unrechtmäßig geschah / geschieht, können Sie statt der Löschung die Einschränkung der Datenverarbeitung verlangen.\\n• Wenn wir Ihre personenbezogenen Daten nicht mehr benötigen, Sie sie jedoch zur Ausübung, Verteidigung oder Geltendmachung von Rechtsansprüchen benötigen, haben Sie das Recht, statt der Löschung die Einschränkung der Verarbeitung Ihrer personenbezogenen Daten zu verlangen.\\n• Wenn Sie einen Widerspruch nach Art. 21 Abs. 1 DSGVO eingelegt haben, muss eine Abwägung zwischen Ihren und unseren Interessen vorgenommen werden. Solange noch nicht feststeht, wessen Interessen überwiegen, haben Sie das Recht, die Einschränkung der Verarbeitung Ihrer personenbezogenen Daten zu verlangen.','Wenn Sie die Verarbeitung Ihrer personenbezogenen Daten eingeschränkt haben, dürfen diese Daten – von ihrer Speicherung abgesehen – nur mit Ihrer Einwilligung oder zur Geltendmachung, Ausübung oder Verteidigung von Rechtsansprüchen oder zum Schutz der Rechte einer anderen natürlichen oder juristischen Person oder aus Gründen eines wichtigen öffentlichen Interesses der Europäischen Union oder eines Mitgliedstaats verarbeitet werden.','## Widerspruch gegen Werbe-E-Mails','Der Nutzung von im Rahmen der Impressumspflicht veröffentlichten Kontaktdaten zur Übersendung von nicht ausdrücklich angeforderter Werbung und Informationsmaterialien wird hiermit widersprochen. Die Betreiber der Seiten behalten sich ausdrücklich rechtliche Schritte im Falle der unverlangten Zusendung von Werbeinformationen, etwa durch Spam-E-Mails, vor.','# 3. Datenerfassung auf unserer Website','## Cookies','Die Internetseiten verwenden teilweise so genannte Cookies. Cookies richten auf Ihrem Rechner keinen Schaden an und enthalten keine Viren. Cookies dienen dazu, unser Angebot nutzerfreundlicher, effektiver und sicherer zu machen. Cookies sind kleine Textdateien, die auf Ihrem Rechner abgelegt werden und die Ihr Browser speichert.','Die meisten der von uns verwendeten Cookies sind so genannte „Session-Cookies“. Sie werden nach Ende Ihres Besuchs automatisch gelöscht. Andere Cookies bleiben auf Ihrem Endgerät gespeichert bis Sie diese löschen. Diese Cookies ermöglichen es uns, Ihren Browser beim nächsten Besuch wiederzuerkennen.','Sie können Ihren Browser so einstellen, dass Sie über das Setzen von Cookies informiert werden und Cookies nur im Einzelfall erlauben, die Annahme von Cookies für bestimmte Fälle oder generell ausschließen sowie das automatische Löschen der Cookies beim Schließen des Browser aktivieren. Bei der Deaktivierung von Cookies kann die Funktionalität dieser Website eingeschränkt sein.','Cookies, die zur Durchführung des elektronischen Kommunikationsvorgangs oder zur Bereitstellung bestimmter, von Ihnen erwünschter Funktionen (z.B. Warenkorbfunktion) erforderlich sind, werden auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO gespeichert. Der Websitebetreiber hat ein berechtigtes Interesse an der Speicherung von Cookies zur technisch fehlerfreien und optimierten Bereitstellung seiner Dienste. Soweit andere Cookies (z.B. Cookies zur Analyse Ihres Surfverhaltens) gespeichert werden, werden diese in dieser Datenschutzerklärung gesondert behandelt.','Zur Verwaltung der eingesetzten Cookies und ähnlichen Technologien (Tracking-Pixel, Web-Beacons etc.) und diesbezüglicher Einwilligungen setzen wir das Consent Tool „Real Cookie Banner“ ein. Details zur Funktionsweise von „Real Cookie Banner“ findest du unter https://devowl.io/de/rcb/datenverarbeitung/.','Rechtsgrundlagen für die Verarbeitung von personenbezogenen Daten in diesem Zusammenhang sind Art. 6 Abs. 1 lit. c DS-GVO und Art. 6 Abs. 1 lit. f DS-GVO. Unser berechtigtes Interesse ist die Verwaltung der eingesetzten Cookies und ähnlichen Technologien und der diesbezüglichen Einwilligungen.','Die Bereitstellung der personenbezogenen Daten ist weder vertraglich vorgeschrieben noch für den Abschluss eines Vertrages notwendig. Du bist nicht verpflichtet die personenbezogenen Daten bereitzustellen. Wenn du die personenbezogenen Daten nicht bereitstellst, können wir deine Einwilligungen nicht verwalten.','## Server-Log-Dateien','Der Provider der Seiten erhebt und speichert automatisch Informationen in so genannten Server-Log-Dateien, die Ihr Browser automatisch an uns übermittelt. Dies sind:','• Browsertyp und Browserversion\\n• verwendetes Betriebssystem\\n• Referrer URL\\n• Hostname des zugreifenden Rechners\\n• Uhrzeit der Serveranfrage\\n• IP-Adresse','Eine Zusammenführung dieser Daten mit anderen Datenquellen wird nicht vorgenommen.','Die Erfassung dieser Daten erfolgt auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO. Der Websitebetreiber hat ein berechtigtes Interesse an der technisch fehlerfreien Darstellung und der Optimierung seiner Website – hierzu müssen die Server-Log-Files erfasst werden.','## Kontaktformular','Wenn Sie uns per Kontaktformular Anfragen zukommen lassen, werden Ihre Angaben aus dem Anfrageformular inklusive der von Ihnen dort angegebenen Kontaktdaten zwecks Bearbeitung der Anfrage und für den Fall von Anschlussfragen bei uns gespeichert. Diese Daten geben wir nicht ohne Ihre Einwilligung weiter.','Die Verarbeitung der in das Kontaktformular eingegebenen Daten erfolgt somit ausschließlich auf Grundlage Ihrer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO). Sie können diese Einwilligung jederzeit widerrufen. Dazu reicht eine formlose Mitteilung per E-Mail an uns. Die Rechtmäßigkeit der bis zum Widerruf erfolgten Datenverarbeitungsvorgänge bleibt vom Widerruf unberührt.','Die von Ihnen im Kontaktformular eingegebenen Daten verbleiben bei uns, bis Sie uns zur Löschung auffordern, Ihre Einwilligung zur Speicherung widerrufen oder der Zweck für die Datenspeicherung entfällt (z.B. nach abgeschlossener Bearbeitung Ihrer Anfrage). Zwingende gesetzliche Bestimmungen – insbesondere Aufbewahrungsfristen – bleiben unberührt.','## Kommentarfunktion auf dieser Website','Für die Kommentarfunktion auf dieser Seite werden neben Ihrem Kommentar auch Angaben zum Zeitpunkt der Erstellung des Kommentars, Ihre E-Mail-Adresse und, wenn Sie nicht anonym posten, der von Ihnen gewählte Nutzername gespeichert.','Speicherung der IP-Adresse','Unsere Kommentarfunktion speichert die IP-Adressen der Nutzer, die Kommentare verfassen. Da wir Kommentare auf unserer Seite nicht vor der Freischaltung prüfen, benötigen wir diese Daten, um im Falle von Rechtsverletzungen wie Beleidigungen oder Propaganda gegen den Verfasser vorgehen zu können.','Speicherdauer der Kommentare','Die Kommentare und die damit verbundenen Daten (z.B. IP-Adresse) werden gespeichert und verbleiben auf unserer Website, bis der kommentierte Inhalt vollständig gelöscht wurde oder die Kommentare aus rechtlichen Gründen gelöscht werden müssen (z.B. beleidigende Kommentare).','Rechtsgrundlage','Die Speicherung der Kommentare erfolgt auf Grundlage Ihrer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO). Sie können eine von Ihnen erteilte Einwilligung jederzeit widerrufen. Dazu reicht eine formlose Mitteilung per E-Mail an uns. Die Rechtmäßigkeit der bereits erfolgten Datenverarbeitungsvorgänge bleibt vom Widerruf unberührt.','## Verarbeiten von Daten (Kunden- und Vertragsdaten)','Wir erheben, verarbeiten und nutzen personenbezogene Daten nur, soweit sie für die Begründung, inhaltliche Ausgestaltung oder Änderung des Rechtsverhältnisses erforderlich sind (Bestandsdaten). Dies erfolgt auf Grundlage von Art. 6 Abs. 1 lit. b DSGVO, der die Verarbeitung von Daten zur Erfüllung eines Vertrags oder vorvertraglicher Maßnahmen gestattet. Personenbezogene Daten über die Inanspruchnahme unserer Internetseiten (Nutzungsdaten) erheben, verarbeiten und nutzen wir nur, soweit dies erforderlich ist, um dem Nutzer die Inanspruchnahme des Dienstes zu ermöglichen oder abzurechnen.','Die erhobenen Kundendaten werden nach Abschluss des Auftrags oder Beendigung der Geschäftsbeziehung gelöscht. Gesetzliche Aufbewahrungsfristen bleiben unberührt.','## Datenübermittlung bei Vertragsschluss für Online-Shops, Händler und Warenversand','Wir übermitteln personenbezogene Daten an Dritte nur dann, wenn dies im Rahmen der Vertragsabwicklung notwendig ist, etwa an die mit der Lieferung der Ware betrauten Unternehmen oder das mit der Zahlungsabwicklung beauftragte Kreditinstitut. Eine weitergehende Übermittlung der Daten erfolgt nicht bzw. nur dann, wenn Sie der Übermittlung ausdrücklich zugestimmt haben. Eine Weitergabe Ihrer Daten an Dritte ohne ausdrückliche Einwilligung, etwa zu Zwecken der Werbung, erfolgt nicht.','Grundlage für die Datenverarbeitung ist Art. 6 Abs. 1 lit. b DSGVO, der die Verarbeitung von Daten zur Erfüllung eines Vertrags oder vorvertraglicher Maßnahmen gestattet.','# 4. Newsletter','## Newsletterdaten','Wenn Sie den auf der Website angebotenen Newsletter beziehen möchten, benötigen wir von Ihnen eine E-Mail-Adresse sowie Informationen, welche uns die Überprüfung gestatten, dass Sie der Inhaber der angegebenen E-Mail-Adresse sind und mit dem Empfang des Newsletters einverstanden sind. Weitere Daten werden nicht bzw. nur auf freiwilliger Basis erhoben. Diese Daten verwenden wir ausschließlich für den Versand der angeforderten Informationen und geben diese nicht an Dritte weiter.','Die Verarbeitung der in das Newsletteranmeldeformular eingegebenen Daten erfolgt ausschließlich auf Grundlage Ihrer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO). Die erteilte Einwilligung zur Speicherung der Daten, der E-Mail-Adresse sowie deren Nutzung zum Versand des Newsletters können Sie jederzeit widerrufen, etwa über den „Austragen“-Link im Newsletter. Die Rechtmäßigkeit der bereits erfolgten Datenverarbeitungsvorgänge bleibt vom Widerruf unberührt.','Die von Ihnen zum Zwecke des Newsletter-Bezugs bei uns hinterlegten Daten werden von uns bis zu Ihrer Austragung aus dem Newsletter gespeichert und nach der Abbestellung des Newsletters gelöscht. Daten, die zu anderen Zwecken bei uns gespeichert wurden bleiben hiervon unberührt.','## MailChimp','Diese Website nutzt die Dienste von MailChimp für den Versand von Newslettern. Anbieter ist die Rocket Science Group LLC, 675 Ponce De Leon Ave NE, Suite 5000, Atlanta, GA 30308, USA.','MailChimp ist ein Dienst, mit dem u.a. der Versand von Newslettern organisiert und analysiert werden kann. Wenn Sie Daten zum Zwecke des Newsletterbezugs eingeben (z.B. E-Mail-Adresse), werden diese auf den Servern von MailChimp in den USA gespeichert.','MailChimp verfügt über eine Zertifizierung nach dem „EU-US-Privacy-Shield“. Der „Privacy-Shield“ ist ein Übereinkommen zwischen der Europäischen Union (EU) und den USA, das die Einhaltung europäischer Datenschutzstandards in den USA gewährleisten soll.','Mit Hilfe von MailChimp können wir unsere Newsletterkampagnen analysieren. Wenn Sie eine mit MailChimp versandte E-Mail öffnen, verbindet sich eine in der E-Mail enthaltene Datei (sog. web-beacon) mit den Servern von MailChimp in den USA. So kann festgestellt werden, ob eine Newsletter-Nachricht geöffnet und welche Links ggf. angeklickt wurden. Außerdem werden technische Informationen erfasst (z.B. Zeitpunkt des Abrufs, IP-Adresse, Browsertyp und Betriebssystem). Diese Informationen können nicht dem jeweiligen Newsletter-Empfänger zugeordnet werden. Sie dienen ausschließlich der statistischen Analyse von Newsletterkampagnen. Die Ergebnisse dieser Analysen können genutzt werden, um künftige Newsletter besser an die Interessen der Empfänger anzupassen.','Wenn Sie keine Analyse durch MailChimp wollen, müssen Sie den Newsletter abbestellen. Hierfür stellen wir in jeder Newsletternachricht einen entsprechenden Link zur Verfügung. Des Weiteren können Sie den Newsletter auch direkt auf der Website abbestellen.','Die Datenverarbeitung erfolgt auf Grundlage Ihrer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO). Sie können diese Einwilligung jederzeit widerrufen, indem Sie den Newsletter abbestellen. Die Rechtmäßigkeit der bereits erfolgten Datenverarbeitungsvorgänge bleibt vom Widerruf unberührt.','Die von Ihnen zum Zwecke des Newsletter-Bezugs bei uns hinterlegten Daten werden von uns bis zu Ihrer Austragung aus dem Newsletter gespeichert und nach der Abbestellung des Newsletters sowohl von unseren Servern als auch von den Servern von MailChimp gelöscht. Daten, die zu anderen Zwecken bei uns gespeichert wurden bleiben hiervon unberührt.','Näheres entnehmen Sie den Datenschutzbestimmungen von MailChimp unter: https://mailchimp.com/legal/terms/.','Abschluss eines Data-Processing-Agreements','Wir haben ein sog. „Data-Processing-Agreement“ mit MailChimp abgeschlossen, in dem wir MailChimp verpflichten, die Daten unserer Kunden zu schützen und sie nicht an Dritte weiterzugeben. Dieser Vertrag kann unter folgendem Link eingesehen werden: https://mailchimp.com/legal/forms/data-processing-agreement/sample-agreement/.','# 5. Plugins und Tools','## Google Web Fonts','Diese Seite nutzt zur einheitlichen Darstellung von Schriftarten so genannte Web Fonts, die von Google bereitgestellt werden. Beim Aufruf einer Seite lädt Ihr Browser die benötigten Web Fonts in ihren Browsercache, um Texte und Schriftarten korrekt anzuzeigen.','Zu diesem Zweck muss der von Ihnen verwendete Browser Verbindung zu den Servern von Google aufnehmen. Hierdurch erlangt Google Kenntnis darüber, dass über Ihre IP-Adresse unsere Website aufgerufen wurde. Die Nutzung von Google Web Fonts erfolgt im Interesse einer einheitlichen und ansprechenden Darstellung unserer Online-Angebote. Dies stellt ein berechtigtes Interesse im Sinne von Art. 6 Abs. 1 lit. f DSGVO dar.','Wenn Ihr Browser Web Fonts nicht unterstützt, wird eine Standardschrift von Ihrem Computer genutzt.','Weitere Informationen zu Google Web Fonts finden Sie unter https://developers.google.com/fonts/faq und in der Datenschutzerklärung von Google: https://policies.google.com/privacy?hl=de.','## Google Maps','Diese Seite nutzt über eine API den Kartendienst Google Maps. Anbieter ist die Google Inc., 1600 Amphitheatre Parkway, Mountain View, CA 94043, USA.','Zur Nutzung der Funktionen von Google Maps ist es notwendig, Ihre IP Adresse zu speichern. Diese Informationen werden in der Regel an einen Server von Google in den USA übertragen und dort gespeichert. Der Anbieter dieser Seite hat keinen Einfluss auf diese Datenübertragung.','Die Nutzung von Google Maps erfolgt im Interesse einer ansprechenden Darstellung unserer Online-Angebote und an einer leichten Auffindbarkeit der von uns auf der Website angegebenen Orte. Dies stellt ein berechtigtes Interesse im Sinne von Art. 6 Abs. 1 lit. f DSGVO dar.','Mehr Informationen zum Umgang mit Nutzerdaten finden Sie in der Datenschutzerklärung von Google: https://policies.google.com/privacy?hl=de.','## Google reCAPTCHA','Wir nutzen „Google reCAPTCHA“ (im Folgenden „reCAPTCHA“) auf unseren Websites. Anbieter ist die Google Inc., 1600 Amphitheatre Parkway, Mountain View, CA 94043, USA („Google“).','Mit reCAPTCHA soll überprüft werden, ob die Dateneingabe auf unseren Websites (z.B. in einem Kontaktformular) durch einen Menschen oder durch ein automatisiertes Programm erfolgt. Hierzu analysiert reCAPTCHA das Verhalten des Websitebesuchers anhand verschiedener Merkmale. Diese Analyse beginnt automatisch, sobald der Websitebesucher die Website betritt. Zur Analyse wertet reCAPTCHA verschiedene Informationen aus (z.B. IP-Adresse, Verweildauer des Websitebesuchers auf der Website oder vom Nutzer getätigte Mausbewegungen). Die bei der Analyse erfassten Daten werden an Google weitergeleitet.','Die reCAPTCHA-Analysen laufen vollständig im Hintergrund. Websitebesucher werden nicht darauf hingewiesen, dass eine Analyse stattfindet.','Die Datenverarbeitung erfolgt auf Grundlage von Art. 6 Abs. 1 lit. f DSGVO. Der Websitebetreiber hat ein berechtigtes Interesse daran, seine Webangebote vor missbräuchlicher automatisierter Ausspähung und vor SPAM zu schützen.','Weitere Informationen zu Google reCAPTCHA sowie die Datenschutzerklärung von Google entnehmen Sie folgenden Links: https://policies.google.com/privacy?hl=de und https://www.google.com/recaptcha/intro/android.html.','# 6. Zahlungsanbieter und Reseller','## PayPal','Auf unserer Website bieten wir u.a. die Bezahlung via PayPal an. Anbieter dieses Zahlungsdienstes ist die PayPal (Europe) S.à.r.l. et Cie, S.C.A., 22-24 Boulevard Royal, L-2449 Luxembourg (im Folgenden „PayPal“).','Wenn Sie die Bezahlung via PayPal auswählen, werden die von Ihnen eingegebenen Zahlungsdaten an PayPal übermittelt.','Die Übermittlung Ihrer Daten an PayPal erfolgt auf Grundlage von Art. 6 Abs. 1 lit. a DSGVO (Einwilligung) und Art. 6 Abs. 1 lit. b DSGVO (Verarbeitung zur Erfüllung eines Vertrags). Sie haben die Möglichkeit, Ihre Einwilligung zur Datenverarbeitung jederzeit zu widerrufen. Ein Widerruf wirkt sich auf die Wirksamkeit von in der Vergangenheit liegenden Datenverarbeitungsvorgängen nicht aus.'] },\n    agb: { title:'AGB – Allgemeine Geschäftsbedingungen', lines:['# 1. Geltungsbereich','Für alle Bestellungen über unseren Online-Shop gelten die nachfolgenden AGB.','# 2. Vertragspartner, Vertragsschluss','Der Kaufvertrag kommt zustande mit Medizintechnik Kaasen GmbH.','Mit Einstellung der Produkte in den Online-Shop geben wir ein verbindliches Angebot zum Vertragsschluss über diese Artikel ab. Sie können unsere Produkte zunächst unverbindlich in den Warenkorb legen und Ihre Eingaben vor Absenden Ihrer verbindlichen Bestellung jederzeit korrigieren, indem Sie die hierfür im Bestellablauf vorgesehenen und erläuterten Korrekturhilfen nutzen. Der Vertrag kommt zustande, indem Sie durch Anklicken des Bestellbuttons das Angebot über die im Warenkorb enthaltenen Waren annehmen. Unmittelbar nach dem Absenden der Bestellung erhalten Sie noch einmal eine Bestätigung per E-Mail.','# 3. Vertragssprache, Vertragstextspeicherung','Die für den Vertragsschluss zur Verfügung stehende Sprache ist Deutsch.','Wir speichern den Vertragstext und senden Ihnen die Bestelldaten und unsere AGB per E-Mail zu. Den Vertragstext können Sie in unserem Kunden-Login einsehen.','# 4. Lieferbedingungen','Zuzüglich zu den angegebenen Produktpreisen kommen noch Versandkosten hinzu. Näheres zur Höhe der Versandkosten erfahren Sie bei den Angeboten.','Wir liefern nur im Versandweg. Eine Selbstabholung der Ware ist leider nicht möglich.','# 5. Bezahlung','In unserem Shop stehen Ihnen grundsätzlich die folgenden Zahlungsarten zur Verfügung:','## Vorkasse','Bei Auswahl der Zahlungsart Vorkasse nennen wir Ihnen unsere Bankverbindung in separater E-Mail und liefern die Ware nach Zahlungseingang.','## PayPal, PayPal Express','Im Bestellprozess werden Sie auf die Webseite des Online-Anbieters PayPal weitergeleitet. Um den Rechnungsbetrag über PayPal bezahlen zu können, müssen Sie dort registriert sein bzw. sich erst registrieren, mit Ihren Zugangsdaten legitimieren und die Zahlungsanweisung an uns bestätigen. Nach Abgabe der Bestellung im Shop fordern wir PayPal zur Einleitung der Zahlungstransaktion auf.\\nDie Zahlungstransaktion wird durch PayPal unmittelbar danach automatisch durchgeführt. Weitere Hinweise erhalten Sie beim Bestellvorgang.','# 6. Eigentumsvorbehalt','Die Ware bleibt bis zur vollständigen Bezahlung unser Eigentum.','# 7. Transportschäden','Werden Waren mit offensichtlichen Transportschäden angeliefert, so reklamieren Sie solche Fehler bitte möglichst sofort beim Zusteller und nehmen Sie bitte unverzüglich Kontakt zu uns auf. Die Versäumung einer Reklamation oder Kontaktaufnahme hat für Ihre gesetzlichen Ansprüche und deren Durchsetzung, insbesondere Ihre Gewährleistungsrechte, keinerlei Konsequenzen. Sie helfen uns aber, unsere eigenen Ansprüche gegenüber dem Frachtführer bzw. der Transportversicherung geltend machen zu können.','# 8. Gewährleistung und Garantien','Soweit nicht nachstehend ausdrücklich anders vereinbart, gilt das gesetzliche Mängelhaftungsrecht.\\nDie Verjährungsfrist für Mängelansprüche beträgt bei gebrauchten Sachen ein Jahr ab Ablieferung der Ware.\\nDie vorstehenden Einschränkungen und Fristverkürzungen gelten nicht für Ansprüche aufgrund von Schäden, die durch uns, unsere gesetzlichen Vertreter oder Erfüllungsgehilfen verursacht wurden','• bei Verletzung des Lebens, des Körpers oder der Gesundheit,\\n• bei vorsätzlicher oder grob fahrlässiger Pflichtverletzung sowie Arglist,\\n• bei Verletzung wesentlicher Vertragspflichten, deren Erfüllung die ordnungsgemäße Durchführung des Vertrages überhaupt erst ermöglicht und auf deren Einhaltung der Vertragspartner regelmäßig vertrauen darf (Kardinalpflichten)\\n• im Rahmen eines Garantieversprechens, soweit vereinbart oder\\n• soweit der Anwendungsbereich des Produkthaftungsgesetzes eröffnet ist.','Informationen zu gegebenenfalls geltenden zusätzlichen Garantien und deren genaue Bedingungen finden Sie jeweils beim Produkt und auf besonderen Informationsseiten im Onlineshop.','# 9. Haftung','Für Ansprüche aufgrund von Schäden, die durch uns, unsere gesetzlichen Vertreter oder Erfüllungsgehilfen verursacht wurden, haften wir stets unbeschränkt','• bei Verletzung des Lebens, des Körpers oder der Gesundheit,\\n• bei vorsätzlicher oder grob fahrlässiger Pflichtverletzung,\\n• bei Garantieversprechen, soweit vereinbart, oder\\n• soweit der Anwendungsbereich des Produkthaftungsgesetzes eröffnet ist.','Bei Verletzung wesentlicher Vertragspflichten, deren Erfüllung die ordnungsgemäße Durchführung des Vertrages überhaupt erst ermöglicht und auf deren Einhaltung der Vertragspartner regelmäßig vertrauen darf, (Kardinalpflichten) durch leichte Fahrlässigkeit von uns, unseren gesetzlichen Vertretern oder Erfüllungsgehilfen ist die Haftung der Höhe nach auf den bei Vertragsschluss vorhersehbaren Schaden begrenzt, mit dessen Entstehung typischerweise gerechnet werden muss. Im Übrigen sind Ansprüche auf Schadensersatz ausgeschlossen.','# 10. Streitbeilegung','Die Europäische Kommission stellt eine Plattform zur Online-Streitbeilegung (OS) bereit, die Sie hier finden https://ec.europa.eu/consumers/odr/.\\nZur Teilnahme an einem Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle sind wir nicht verpflichtet und nicht bereit.','AGB erstellt mit dem Trusted Shops Rechtstexter in Kooperation mit Wilde Beuger Solmecke Rechtsanwälte.'] },\n    widerrufsbelehrung: { title:'Widerrufsbelehrung', lines:['# Widerrufsrecht','Sie haben das Recht, binnen vierzehn Tagen ohne Angabe von Gründen diesen Vertrag zu widerrufen. Die Widerrufsfrist beträgt vierzehn Tage ab dem Tag, an dem Sie oder ein von Ihnen benannter Dritter, der nicht der Beförderer ist, die Waren in Besitz genommen haben bzw. hat. Um Ihr Widerrufsrecht auszuüben, müssen Sie uns (Medizintechnik Kaasen GmbH, Zum Gewerbepark 4, 44532 Lünen, E-Mail-Adresse: medizintechnik@kaasen.de, Telefon: 02306 306090) mittels einer eindeutigen Erklärung (z. B. ein mit der Post versandter Brief oder E-Mail) über Ihren Entschluss, diesen Vertrag zu widerrufen, informieren. Sie können dafür das beigefügte Muster-Widerrufsformular verwenden, das jedoch nicht vorgeschrieben ist. Zur Wahrung der Widerrufsfrist reicht es aus, dass Sie die Mitteilung über die Ausübung des Widerrufsrechts vor Ablauf der Widerrufsfrist absenden.','Sie können auch direkt über den Button „Vertrag widerrufen“ im Footer widerrufen.','# Folgen des Widerrufs','Wenn Sie diesen Vertrag widerrufen, haben wir Ihnen alle Zahlungen, die wir von Ihnen erhalten haben, einschließlich der Lieferkosten (mit Ausnahme der zusätzlichen Kosten, die sich daraus ergeben, dass Sie eine andere Art der Lieferung als die von uns an
